<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <title>SHOW DE PRÊMIOS - Validação de Cartela - WhatsApp</title>
    <style>
      :root {
        --wa-green: #25d366;
        --bg-main: #0b141a;
        --bg-card: #111b21;
        --bg-input: #202c33;
        --border-color: #2a3942;
        --text-primary: #e9edef;
        --text-secondary: #8696a0;
        --accent: #00a884;
        --radius-md: 8px;
        --radius-lg: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        background: radial-gradient(circle at 50% 0%, #112328 0%, #0b141a 75%);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 12px;
      }
      .container {
        width: 100%;
        max-width: 560px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        box-shadow: 0 12px 32px #0008;
        overflow: hidden;
      }
      .header {
        background: var(--bg-input);
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .header-icon {
        width: 44px;
        height: 44px;
        background: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: white;
        font-size: 22px;
      }
      .header-title {
        min-width: 0;
      }
      .header-title h1 {
        font-size: 1.15rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .cartela-badge {
        background: #00a88433;
        color: var(--accent);
        padding: 2px 8px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 0.95rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .header-title p {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .form-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .section-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: -4px;
      }
      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .input-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 480px) {
        .input-row {
          grid-template-columns: 1fr;
        }
      }
      label {
        font-size: 0.82rem;
        color: var(--text-secondary);
        font-weight: 500;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-primary);
        font-size: 0.92rem;
        outline: none;
        transition: all 0.2s ease;
      }
      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px #00a88433;
      }
      .preview-box {
        background: #0b141a;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 16px;
        background-image: radial-gradient(#1f2c34 1px, transparent 1px);
        background-size: 12px 12px;
      }
      .preview-header {
        font-size: 0.75rem;
        color: var(--text-secondary);
        font-weight: 600;
        margin-bottom: 10px;
      }
      .preview-content {
        background: #202c33;
        border-radius: 0 8px 8px 8px;
        padding: 12px 14px;
        font-size: 0.85rem;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        border-left: 3px solid var(--accent);
        box-shadow: 0 2px 5px #0005;
      }
      .btn-submit {
        background: var(--wa-green);
        color: #0b141a;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 14px 20px;
        border: 0;
        border-radius: var(--radius-md);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 8px;
        transition: all 0.2s ease;
      }
      .btn-submit:hover {
        background: #1fbe5c;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px #25d36640;
      }
      .btn-submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn-submit svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }
      .footer-note {
        text-align: center;
        font-size: 0.75rem;
        color: #9aadb8;
        padding: 12px 24px 20px;
        line-height: 1.5;
      }
      .status {
        font-size: 0.8rem;
        color: #ffd58a;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="header-icon" aria-hidden="true">✓</div>
        <div class="header-title">
          <h1>
            SHOW DE PRÊMIOS - Validação de Cartela
            <span class="cartela-badge" id="titleCartela">#...</span>
          </h1>
          <p>Preencha os dados do envio para o WhatsApp</p>
        </div>
      </div>
      <form id="waForm" class="form-body">
        <input type="hidden" id="telDestino" /><input
          type="hidden"
          id="cartela"
        /><input type="hidden" id="chave" /><input
          type="hidden"
          id="dataHora"
        />
        <p id="status" class="status" role="status" aria-live="polite">
          Inicializando...
        </p>
        <div class="section-label">Dados do envio</div>
        <div class="input-row">
          <div class="input-group">
            <label for="nomeComprador">Nome do Comprador *</label
            ><input
              type="text"
              id="nomeComprador"
              placeholder="Ex: João Silva"
              maxlength="120"
              required
              disabled
              autocomplete="name"
              enterkeyhint="next"
            />
          </div>
          <div class="input-group">
            <label for="telComprador">Telefone Comprador *</label
            ><input
              type="tel"
              id="telComprador"
              placeholder="(67) 99999-9999"
              maxlength="40"
              required
              disabled
              enterkeyhint="next"
            />
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label for="nomeVendedor">Nome do Vendedor</label
            ><input
              type="text"
              id="nomeVendedor"
              placeholder="Ex: Maria Souza"
              maxlength="120"
              disabled
              enterkeyhint="next"
            />
          </div>
          <div class="input-group">
            <label for="telVendedor">Telefone Vendedor</label
            ><input
              type="tel"
              id="telVendedor"
              placeholder="(67) 98888-8888"
              maxlength="40"
              disabled
              enterkeyhint="send"
            />
          </div>
        </div>
        <div class="preview-box">
          <div class="preview-header">💬 PRÉVIA DOS DADOS PREENCHIDOS</div>
          <div class="preview-content" id="messagePreview">...</div>
        </div>
        <button type="submit" class="btn-submit" id="enviar" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.4-.2-2.6.7.7-2.5-.3-.5A8 8 0 1 1 12 20z"
            /></svg
          >Enviar pelo WhatsApp
        </button>
      </form>
      <div class="footer-note">
        Confirme o envio no seu WhatsApp. Esta página não salva cadastros.<br />ENTER
        avança; TAB e SHIFT+TAB mantêm a navegação normal.
      </div>
      <noscript>Ative o JavaScript para preencher o formulário.</noscript>
    </div>
    <script>
      /* CADASTRO_WHATSAPP_v004: sem banco, API própria ou validação HMAC. */
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const ordem = [
          "nomeComprador",
          "telComprador",
          "nomeVendedor",
          "telVendedor",
        ];
        const eventos = [];
        let identidade = null;

        function log(nivel, etapa) {
          try {
            const item = Object.freeze({
              data: new Date().toISOString(),
              nivel,
              etapa,
            });
            eventos.push(item);
            if (eventos.length > 100) eventos.shift();
            console.info("[CADASTRO_v004]", nivel, etapa);
          } catch {
            /* Não incluir dados pessoais em mensagens de fallback. */
          }
        }

        // Diagnóstico somente pelo console, sem botões adicionais nem dados pessoais.
        Object.defineProperty(window, "CADASTRO_DEBUG", {
          value: Object.freeze({
            versao: "CADASTRO_WHATSAPP_v004",
            obterLogs: () => eventos.map((item) => ({ ...item })),
          }),
          writable: false,
        });

        function informar(texto) {
          try {
            $("status").textContent = texto;
          } catch {
            log("ERROR", "STATUS_FALHOU");
          }
        }

        function parametro(p, nomes) {
          try {
            const valores = nomes.flatMap((nome) => p.getAll(nome));
            if (valores.length !== 1 || !valores[0])
              throw new Error("Parâmetro ausente ou duplicado: " + nomes[0]);
            return valores[0];
          } catch (e) {
            log("ERROR", "PARAMETRO_INVALIDO");
            throw e;
          }
        }

        function telefone(valor, obrigatorio, nacional = true) {
          try {
            const s = valor.trim();
            if (!s && !obrigatorio) return "";
            if (!/^\+?[0-9 ().-]+$/.test(s))
              throw new Error(
                "Telefone inválido. Use DDD e número; para outro país, informe + e código internacional.",
              );
            let n = s.replace(/\D/g, "");
            if (nacional && !s.startsWith("+") && [10, 11].includes(n.length))
              n = "55" + n;
            if (!/^[1-9][0-9]{0,14}$/.test(n))
              throw new Error(
                "Telefone inválido: até 15 dígitos, sem zero inicial.",
              );
            return "+" + n;
          } catch (e) {
            log("ERROR", "TELEFONE_INVALIDO");
            throw e;
          }
        }

        function nome(valor, obrigatorio) {
          try {
            const s = valor.trim();
            if (
              (obrigatorio && !s) ||
              s.length > 120 ||
              /[\x00-\x1f\x7f\u2028\u2029]/.test(s)
            )
              throw new Error(
                "Preencha os nomes sem quebras de linha, com até 120 caracteres.",
              );
            return s;
          } catch (e) {
            log("ERROR", "NOME_INVALIDO");
            throw e;
          }
        }

        function lerURL() {
          try {
            const p = new URLSearchParams(location.search);
            const destino = telefone(
              parametro(p, ["destino", "TelefoneDestino", "telDestino"]),
              true,
              false,
            ).slice(1);
            const cartela = parametro(p, ["cartela", "numeroCartela"]);
            const chave = parametro(p, ["chave"]);
            if (!/^[0-9]{1,30}$/.test(cartela))
              throw new Error("Número da cartela inválido.");
            if (chave.length > 512 || /[\s\x00-\x1f\x7f]/.test(chave))
              throw new Error(
                "Chave inválida. Codifique a assinatura corretamente na URL.",
              );
            return Object.freeze({ destino, cartela, chave });
          } catch (e) {
            log("ERROR", "URL_INVALIDA");
            throw e;
          }
        }

        function dataHoraAtual() {
          try {
            const d = new Date();
            const p = (n) => String(n).padStart(2, "0");
            return (
              p(d.getDate()) +
              "/" +
              p(d.getMonth() + 1) +
              "/" +
              d.getFullYear() +
              " " +
              p(d.getHours()) +
              ":" +
              p(d.getMinutes()) +
              ":" +
              p(d.getSeconds())
            );
          } catch (e) {
            log("ERROR", "DATA_FALHOU");
            throw e;
          }
        }

        function coletar(validar) {
          try {
            const d = Object.fromEntries(
              ordem.map((id) => [id, $(id).value.trim()]),
            );
            if (validar) {
              d.nomeComprador = nome(d.nomeComprador, true);
              d.telComprador = telefone(d.telComprador, true);
              d.nomeVendedor = nome(d.nomeVendedor, false);
              d.telVendedor = telefone(d.telVendedor, false);
            }
            return d;
          } catch (e) {
            log("ERROR", "DADOS_INVALIDOS");
            throw e;
          }
        }

        function construirMensagem(d, dataHora) {
          try {
            return (
              `🎟️ *VALIDAÇÃO DA CARTELA #${identidade.cartela}*\n` +
              `----------------------------------------\n` +
              `👤 *Comprador:* ${d.nomeComprador}\n` +
              `📞 *Tel Comprador:* ${d.telComprador}\n` +
              `🤝 *Vendedor:* ${d.nomeVendedor}\n` +
              `📱 *Tel Vendedor:* ${d.telVendedor}\n` +
              `----------------------------------------\n` +
              `🏷️ *Cartela:* ${identidade.cartela}\n` +
              `🔑 *Chave:* ${identidade.chave}\n` +
              `📅 *Data/Hora:* ${dataHora}`
            );
          } catch (e) {
            log("ERROR", "MENSAGEM_FALHOU");
            throw e;
          }
        }

        function atualizarPrevia() {
          try {
            const d = coletar(false);
            // Identificação não é mostrada na prévia, conforme o escopo solicitado.
            $("messagePreview").textContent =
              `👤 Comprador: ${d.nomeComprador}\n📞 Tel Comprador: ${d.telComprador}\n🤝 Vendedor: ${d.nomeVendedor}\n📱 Tel Vendedor: ${d.telVendedor}`;
          } catch {
            log("ERROR", "PREVIA_FALHOU");
          }
        }

        function confirmarVendedor(d) {
          try {
            const faltam = [];
            if (!d.nomeVendedor) faltam.push("nome do vendedor");
            if (!d.telVendedor) faltam.push("telefone do vendedor");
            return (
              !faltam.length ||
              window.confirm(
                "Faltam: " +
                  faltam.join(" e ") +
                  ". Deseja continuar deixando os campos faltantes em branco?",
              )
            );
          } catch (e) {
            log("ERROR", "CONFIRMACAO_FALHOU");
            throw e;
          }
        }

        function abrirWhatsApp(url) {
          let a;
          try {
            // Âncora temporária, sem segundo botão visível e sem HTML dentro da URL.
            a = document.createElement("a");
            a.href = url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.hidden = true;
            document.body.append(a);
            a.click();
          } catch (e) {
            log("ERROR", "ABERTURA_FALHOU");
            throw e;
          } finally {
            if (a) a.remove();
          }
        }

        function enviar(e) {
          e.preventDefault();
          try {
            if (!identidade) throw new Error("Abra um link válido de cartela.");
            if (!$("waForm").reportValidity()) return;
            const d = coletar(true);
            if (!confirmarVendedor(d)) {
              informar(
                "Envio cancelado. Complete os dados do vendedor se desejar.",
              );
              return;
            }
            const dataHora = dataHoraAtual();
            $("dataHora").value = dataHora;
            const textoCodificado = encodeURIComponent(
              construirMensagem(d, dataHora),
            );
            const url =
              "https://api.whatsapp.com/send?phone=" +
              identidade.destino +
              "&text=" +
              textoCodificado;
            abrirWhatsApp(url);
            log("INFO", "ABERTURA_WHATSAPP_SOLICITADA");
            informar(
              "Confirme o envio no WhatsApp. Se não abriu, permita a abertura de janelas para este site e clique novamente em Enviar pelo WhatsApp.",
            );
          } catch (erro) {
            informar(erro.message || "Não foi possível preparar a mensagem.");
            log("ERROR", "ENVIO_FALHOU");
          }
        }

        function navegar(e) {
          try {
            if (
              e.key !== "Enter" ||
              e.isComposing ||
              e.ctrlKey ||
              e.altKey ||
              e.metaKey
            )
              return;
            const i = ordem.indexOf(e.target.id);
            if (i < 0) return;
            e.preventDefault();
            if (i < ordem.length - 1) $(ordem[i + 1]).focus();
            else $("waForm").requestSubmit();
          } catch {
            log("ERROR", "NAVEGACAO_FALHOU");
          }
        }

        function iniciar() {
          try {
            log("INFO", "INICIO");
            identidade = lerURL();
            $("telDestino").value = identidade.destino;
            $("cartela").value = identidade.cartela;
            $("chave").value = identidade.chave;
            $("titleCartela").textContent = "#" + identidade.cartela;
            document.title = "SHOW DE PRÊMIOS - Cartela " + identidade.cartela;
            ordem.forEach((id) => {
              $(id).disabled = false;
            });
            $("enviar").disabled = false;
            informar(
              "Destino do envio: +" +
                identidade.destino +
                ". Confira antes de continuar.",
            );
            atualizarPrevia();
            $("nomeComprador").focus();
            log("INFO", "FORMULARIO_PRONTO");
          } catch (e) {
            informar(
              e.message || "Link inválido. Solicite outro link ao organizador.",
            );
            log("ERROR", "INICIALIZACAO_FALHOU");
          }
        }

        $("waForm").addEventListener("submit", enviar);
        $("waForm").addEventListener("keydown", navegar);
        ordem.forEach((id) => $(id).addEventListener("input", atualizarPrevia));
        iniciar();
      })();
    </script>
  </body>
</html>
